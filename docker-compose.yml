services:
  mongo:
    # https://hub.docker.com/_/mongo/tags?page=1&name=7.0
    image: mongo:7.0.31
    container_name: unifi_mongo
    networks:
      unifi_priv:
    restart: always
    healthcheck:
        test: echo 'db.runCommand("ping").ok' | mongosh mongo:27017/test --quiet
        interval: 10s
        timeout: 10s
        retries: 5
        start_period: 40s
    volumes:
      - $PWD/db:/data/db


  unifi:
    build:
      context: .
    container_name: unifi_controller
    depends_on:
      - mongo
    init: true
    networks:
      unifi:
        ipv4_address: 192.168.1.5
      unifi_priv:
    restart: always
    volumes:
      - $PWD/data:/unifi
    user: unifi
    environment:
      DB_URI: "mongodb://mongo/unifi"
      STATDB_URI: "mongodb://mongo/unifi_stat"
      DB_NAME: "unifi"
      TZ: "America/Chicago"
      # https://help.ui.com/hc/en-us/articles/115005159588-UniFi-How-to-Tune-the-Network-Application-for-High-Number-of-UniFi-Devices
      #LOTSOFDEVICES: true
    ports:
      - "1900:1900/udp" # Application discoverable on L2 network
      - "3478:3478/udp" # STUN
      - "5514:5514/udp" # Remote syslog capture
      - "6789:6789/tcp" # Speed test
      - "8080:8080/tcp" # Device/controller communication
      - "8443:8443/tcp" # Controller GUI/API as seen in a web browser
      - "8880:8880/tcp" # HTTP portal redirection
      - "8843:8843/tcp" # HTTPS portal redirection
      - "10001:10001/udp" # AP discovery

networks:
  unifi_priv:
    internal: true
  unifi:
    driver: ipvlan
    ipam:
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.1
    driver_opts:
      ipvlan_mode: l2
      parent: enP4p65s0
